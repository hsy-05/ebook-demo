<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="keywords" content="數字火車冒險 - 幼兒互動電子書" />
    <meta name="description" content="數字火車冒險 - 幼兒互動電子書" />
    <title>數字火車冒險 - 幼兒互動電子書</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>數字火車冒險 - 幼兒互動電子書</title>
    <link rel="stylesheet" href="css/train.css" />
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <main class="ebook-container">
      <nav class="page-navigation">
        <div class="route-links">
          <a href="game-monster.html" class="nav-link">餵食怪獸</a>
          <a href="game-train.html" class="nav-link active">數字火車</a>
        </div>
        <button id="btn-restart" class="control-btn">重新開始 ↻</button>
      </nav>

      <header class="game-header">
        <div class="level-indicator">
          關卡: <span id="train-level">1</span> /
          <span id="train-max-level">3</span>
        </div>
        <div id="train-bubble" class="speech-bubble">
          請找出正確的數字單字：<span id="target-number-display">12</span>
        </div>
      </header>

      <section class="bear-adventure-stage">
        <div class="adventure-track">
          <div id="train-character" class="train-token">
            <img
              src="assets/images/train/train.png"
              alt="數字火車"
              draggable="false"
            />
          </div>
          <div class="bear-home-target">
            <img
              src="assets/images/train/station.png"
              alt="火車站"
              draggable="false"
            />
          </div>
        </div>
      </section>

      <footer class="letter-keyboard-zone">
        <p class="guide-text">點擊下方正確的英文名稱，讓火車前進前進！</p>
        <div id="options-container" class="letter-button-row"></div>
      </footer>
    </main>

    <!-- 引入主要邏輯 JavaScript -->
    <script src="js/audio-manager.js.js"></script>
    <script src="js/train.js"></script>
  </body>
</html>
